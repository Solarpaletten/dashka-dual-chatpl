#
# Dashka Android — Version Catalog (Sprint 1)
#
# Sprint 1 scope: text-only translation MVP.
# No STT, no TTS, no ExoPlayer, no Compose animations beyond what's free in Material3.
#
# Versions are pinned to the values verified for Sprint 1 (May 2026).
# Newer libs (media3, accompanist, etc.) will be added in later sprints.

[versions]
# Build
agp = "8.13.0"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.31"

# AndroidX core
coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
navigationCompose = "2.9.0"

# Compose
composeBom = "2026.04.01"

# DI
hilt = "2.57"
hiltNavigationCompose = "1.2.0"

# Network
retrofit = "3.0.0"
okhttp = "5.3.0"
kotlinxSerialization = "1.8.1"
# Note: Retrofit 3.0+ ships its own first-party kotlinx-serialization converter
# (com.squareup.retrofit2:converter-kotlinx-serialization). The old Jake Wharton
# fork (com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter)
# is archived and predates Retrofit 3.

# Coroutines
coroutines = "1.10.2"

# Desugaring
desugar = "2.1.5"

[libraries]
# Compose BOM + UI
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Network
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Desugaring
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
