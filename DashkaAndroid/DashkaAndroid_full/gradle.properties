# Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ──────────────────────────────────────────────────────────────────────
# Dashka API token (REC-001 compatibility).
#
# This token is read at build-time and embedded into BuildConfig.
# It is NOT a real secret — see the security note in dashka-rec-001-005-fix-report.md.
# It is an abuse-deterrent that prevents random scraping and curl-script attacks.
#
# For local development:
#   1. Copy this property here OR override via:
#      ~/.gradle/gradle.properties      (preferred, never committed)
#      command line:  ./gradlew assembleDebug -PDASHKA_API_TOKEN=...
#
#   2. Token must match the DASHKA_API_TOKEN env var on the Vercel backend.
#
# If left empty, builds still work, but the app will get 401 from the backend
# (assuming the backend has the env token set).
# ──────────────────────────────────────────────────────────────────────
DASHKA_API_TOKEN=
